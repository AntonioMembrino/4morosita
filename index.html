<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mi vuoi bene?</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<style>
body{
    background:#f8f9fa;
    height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    overflow:hidden;
}
#btn-si{transition:transform .3s ease;}
#btn-no{transition:all .2s ease;}
.gif-felice{display:none;max-width:300px;border-radius:15px;}

#btn-fortunata{
    margin-top:25px;
}

.modal-content{
    border-radius:20px;
}
</style>
</head>
<body>

<div class="text-center">
    <h1 id="titolo" class="display-4 mb-4">Mi vuoi bene?</h1>

    <div id="controlli">
        <button id="btn-si" class="btn btn-success btn-lg mx-2">SÌ</button>
        <button id="btn-no" class="btn btn-danger btn-lg mx-2">NO</button>
    </div>

    <img id="gif" src="felice.gif" class="gif-felice shadow-lg mt-3">

    <div>
        <button id="btn-fortunata" class="btn btn-warning btn-lg">
            Ti senti fortunata?
        </button>
    </div>

    <!-- Nuova sezione: Link alla Guida al Regalino -->
    <div class="mt-4">
        <a href="guida-regalino.html" class="btn btn-outline-primary btn-sm rounded-pill px-4">
            📖 Guida al regalino
        </a>
    </div>
</div>

<div class="modal fade" id="regaloModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg">
      <div class="modal-header">
        <h5 class="modal-title">🎁 Regalino in arrivo</h5>
      </div>
      <div class="modal-body fs-5 text-center">
        Vuoi davvero il tuo regalino?
      </div>
      <div class="modal-footer justify-content-center">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">No</button>
        <button type="button" id="btn-voucher" class="btn btn-success">Sì ❤️</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

<script>
const btnSi = document.getElementById('btn-si');
const btnNo = document.getElementById('btn-no');
const gif = document.getElementById('gif');
const titolo = document.getElementById('titolo');
const controlli = document.getElementById('controlli');

let clickNo = 0;
let siScale = 1;

btnSi.onclick = () => {
    titolo.innerText = "Sapevo che mi volevi bene! ❤️";
    controlli.style.display = 'none';
    gif.style.display = 'block';
};

btnNo.onclick = () => {
    clickNo++;
    siScale += 0.5;
    btnSi.style.transform = `scale(${siScale})`;

    if(clickNo === 4){
        btnNo.style.position = 'fixed';
        btnNo.style.right = '20px';
        btnNo.style.bottom = '20px';
    }

    if(clickNo === 5){
        btnNo.style.transform = 'scale(0.3)';
        btnNo.style.opacity = '0.7';
    }
};

btnNo.onmouseover = () => {
    if(clickNo >= 6){
        const x = Math.random() * (window.innerWidth - btnNo.offsetWidth);
        const y = Math.random() * (window.innerHeight - btnNo.offsetHeight);

        btnNo.style.position = 'fixed';
        btnNo.style.left = x + 'px';
        btnNo.style.top = y + 'px';
    }
};

const btnFortunata = document.getElementById('btn-fortunata');
let fortunaStep = 0;

btnFortunata.onclick = () => {
    fortunaStep++;

    if(fortunaStep === 1){
        btnFortunata.textContent = "Oh sul serio?";
    }
    else if(fortunaStep === 2){
        btnFortunata.textContent = "E allora lo vuoi un regalino?";
    }
    else{
        const modal = new bootstrap.Modal(document.getElementById('regaloModal'));
        modal.show();
    }
};

document.getElementById('btn-voucher').onclick = () => {
    window.open('https://drive.google.com/file/d/1z6l9E0AMoCCAZboVqyRkeMzjSUAXEQkF/view?usp=sharing', '_blank');
};
</script>

</body>
</html>
